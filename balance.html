<style>
  :root {
    --bg: #0b0f15;
    --bg-card: #151b26;
    --border: #222a39;
    --text: #e4e7eb;
    --muted: #8893a6;
    --green: #10b981;
    --red: #ef4444;
    --warn: #f59e0b;
    --blue: #3b82f6;
    --purple: #a855f7;
    --orange: #f97316;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; font-size: 13px; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; }
  nav a { color: var(--muted); text-decoration: none; margin-right: 14px; font-size: 12px; }
  nav a.active { color: var(--text); border-bottom: 2px solid #60a5fa; padding-bottom: 4px; }
  nav a:hover { color: var(--text); }
  .updated { color: var(--muted); font-size: 11px; margin-right: 12px; }
  .container { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px; }
  .span-all { grid-column: 1 / -1; }

  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .stat .label { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .stat .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .cat-card { padding: 14px 16px; }
  .cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cat-name { font-size: 13px; font-weight: 600; }
  .cat-tag { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; vertical-align: middle; }
  .cat-total { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cat-pct { color: var(--muted); font-size: 11px; margin-left: 6px; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 10px; font-weight: 500; text-transform: uppercase;
    letter-spacing: .5px; }
  td:first-child, th:first-child { text-align: left; }
  td:last-child, th:last-child { padding-right: 0; }
  tr:last-child td { border-bottom: none; }
  .ccy-tag { display: inline-block; font-size: 9px; padding: 1px 4px;
    background: rgba(255,255,255,.06); border-radius: 3px; margin-left: 6px;
    color: var(--muted); vertical-align: middle; }
  .pct-bar {
    display: inline-block; vertical-align: middle; height: 6px;
    background: rgba(255,255,255,.05); border-radius: 2px;
    width: 80px; margin-left: 6px; position: relative;
  }
  .pct-bar .fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 2px; }

  .privacy-toggle { background: transparent; border: 1px solid var(--border);
    color: var(--muted); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
  .privacy-toggle.active { background: rgba(96,165,250,.15); color: #60a5fa; border-color: #60a5fa; }
  .hidden-amounts .sensitive { filter: blur(6px) saturate(0.3); transition: filter 0.15s; cursor: help; }
  .hidden-amounts .sensitive:hover { filter: none; }

  #pie-container { position: relative; height: 280px; }
  .warn-banner { background: rgba(245,158,11,.15); border: 1px solid var(--warn);
    color: var(--warn); padding: 8px 14px; border-radius: 6px;
    font-size: 12px; margin: 12px 20px 0; }
  .ratio-bar {
    height: 28px; background: var(--bg); border-radius: 6px; overflow: hidden;
    display: flex; margin-top: 8px; border: 1px solid var(--border);
  }
  .ratio-bar > div {
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,.95);
    transition: flex-grow 0.3s;
  }

  .negative { color: var(--red); }
  .positive { color: var(--green); }
  @media (max-width: 1100px) { .container { grid-template-columns: 1fr; } }
</style>
</head>
<body><div style="background:#1f2937;color:#fbbf24;font-size:12px;padding:6px 20px;border-bottom:1px solid #374151">演示站 · 所有数字均为虚构示例值，页面结构与计算口径与真实看板一致 · 仅用于展示，不构成任何投资建议</div>
<header>

        <div style="font-size:11px;color:var(--muted)">
          <span style="color:var(--green)">个人 <span class="sensitive" id="aum-personal"></span></span>
          &nbsp;+&nbsp;

</div>

<script>
const fmtHkd = n => {
  if (n===null||n===undefined||isNaN(n)) return '—';
  const sign = n<0?'-':'';
  return sign + 'HK$' + Math.abs(n).toLocaleString('en-US', {maximumFractionDigits: 0});
};
const fmtRmb = n => {
  if (n===null||n===undefined||isNaN(n)) return '—';
  const sign = n<0?'-':'';
  return sign + '¥' + Math.abs(n).toLocaleString('en-US', {maximumFractionDigits: 0});
};
const fmtUsd = n => {
  if (n===null||n===undefined||isNaN(n)) return '—';
  const sign = n<0?'-':'';
  return sign + '$' + Math.abs(n).toLocaleString('en-US', {maximumFractionDigits: 0});
};
const fmtNative = (n, ccy) => {
  if (n===null||n===undefined||isNaN(n)) return '—';
  const sym = ccy === 'USD' ? '$' : (ccy === 'HKD' ? 'HK$' : '¥');
  return sym + Math.abs(n).toLocaleString('en-US', {maximumFractionDigits: 0});
};
const pct = n => (n===null||isNaN(n)) ? '—' : n.toFixed(1) + '%';

function togglePrivacy() {
  document.body.classList.toggle('hidden-amounts');
  const on = document.body.classList.contains('hidden-amounts');
  const btn = document.getElementById('privacy-btn');
  btn.textContent = on ? '🔓 显示金额' : '🔒 隐私';
  btn.classList.toggle('active', on);
  try { localStorage.setItem('hiddenAmounts', on ? '1' : '0'); } catch (e) {}
  // 趋势图的 Y 轴/tooltip 需要重画才会更新 mask 状态
  if (typeof trendChart !== 'undefined' && trendChart) trendChart.update();
}
(function initPrivacy() {
  try {
    if (localStorage.getItem('hiddenAmounts') === '1') {
      document.body.classList.add('hidden-amounts');
      const apply = () => {
        const btn = document.getElementById('privacy-btn');
        if (btn) { btn.textContent = '🔓 显示金额'; btn.classList.add('active'); }
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', apply);
      else apply();
    }
  } catch (e) {}
})();

let pieChart = null;

// 根据 URL path 决定数据源
function detectSource() {
  const p = location.pathname;
  if (p.includes('balance_xi')) return {api:'/api/balance_xi', title:'家人资产负债', nav:'nav-xi'};
  if (p.includes('balance_family')) return {api:'/api/balance_family', title:'家庭资产负债', nav:'nav-family'};
  return {api:'/api/balance', title:'我的资产负债', nav:'nav-mine'};
}
const SRC = detectSource();
document.getElementById('page-title').textContent = SRC.title;
document.querySelectorAll('header nav a').forEach(a => a.style.cssText = 'color:#8893a6;text-decoration:none;margin-right:14px;font-size:12px');
const activeNav = document.getElementById(SRC.nav);
if (activeNav) activeNav.style.cssText = 'color:#e4e7eb;text-decoration:none;border-bottom:2px solid #60a5fa;padding-bottom:4px;margin-right:14px;font-size:12px';

async function load() {
  try {
    const r = await fetch(SRC.api, {cache:'no-store'});
    if (!r.ok) {
      const body = await r.json().catch(()=>({error:'unknown'}));
      document.getElementById('updated').textContent = 'error: ' + body.error;
      return;
    }
    const d = await r.json();
    render(d);
  } catch (e) {
    document.getElementById('updated').textContent = 'fetch failed: ' + e;
  }
}

function render(d) {
  document.getElementById('updated').textContent = 'Updated ' + d.updated_at;

  // warning
  const warnArea = document.getElementById('warning-area');
  warnArea.innerHTML = d.warning ? `<div class="warn-banner">${d.warning}</div>` : '';

  // 顶部 stat (主货币 HKD, 悬停看 RMB / USD)
  const taEl = document.getElementById('total-assets');
  taEl.textContent = fmtHkd(d.total_assets_hkd);
  taEl.title = `≈ ${fmtRmb(d.total_assets_rmb)}\n≈ ${fmtUsd(d.total_assets_usd)}`;
  if (d.target_hkd > 0) {
    const progress = d.total_assets_hkd / d.target_hkd * 100;
    document.getElementById('total-assets-sub').innerHTML =
      `目标 <span class="sensitive">${fmtHkd(d.target_hkd)}</span> · 已达 <span class="sensitive">${progress.toFixed(1)}%</span>`;
  }
  const tdEl = document.getElementById('total-debt');
  tdEl.textContent = fmtHkd(d.total_debt_hkd);
  tdEl.title = `≈ ${fmtRmb(d.total_debt_rmb)}\n≈ ${fmtUsd(d.total_debt_usd)}`;
  const nwEl = document.getElementById('net-worth');
  nwEl.textContent = fmtHkd(d.net_worth_hkd);
  nwEl.title = `≈ ${fmtRmb(d.net_worth_rmb)}\n≈ ${fmtUsd(d.net_worth_usd)}`;
  if (d.target_hkd > 0) {
    const progNet = d.net_worth_hkd / d.target_hkd * 100;
    document.getElementById('net-worth-sub').innerHTML = `目标进度 <span class="sensitive">${progNet.toFixed(1)}%</span>`;
  }
  const ratio = d.debt_ratio_pct;
  const ratioEl = document.getElementById('debt-ratio');
  ratioEl.textContent = pct(ratio);
  ratioEl.className = 'value ' + (ratio > 60 ? 'negative' : (ratio > 40 ? '' : 'positive'));

  // FX hint
  document.getElementById('fx-hint').textContent =
    `汇率: HKD ${d.fx_hkd} · CNY ${d.fx_cny}`;

  // AUM 在管总规模 (仅 /balance 我的视角 有 trustee 数据)
  const aumBar = document.getElementById('aum-bar');
  if (d.aum_total_hkd !== undefined && d.trustee_total_hkd > 0) {
    aumBar.style.display = '';
    const auEl = document.getElementById('aum-total');
    auEl.textContent = fmtHkd(d.aum_total_hkd);
    auEl.title = `≈ ${fmtRmb(d.aum_total_rmb)}\n≈ ${fmtUsd(d.aum_total_usd)}`;
    const apEl = document.getElementById('aum-personal');
    apEl.textContent = fmtHkd(d.total_assets_hkd);
    apEl.title = `≈ ${fmtRmb(d.total_assets_rmb)}`;
    const atEl = document.getElementById('aum-trustee');
    atEl.textContent = fmtHkd(d.trustee_total_hkd);
    atEl.title = `≈ ${fmtRmb(d.trustee_total_rmb)}\n代管资金`;
    // 比例条
    const personalPct = d.total_assets_hkd / d.aum_total_hkd * 100;
    const trusteePct = d.trustee_total_hkd / d.aum_total_hkd * 100;
    document.getElementById('aum-bar-personal').style.flex = personalPct;
    document.getElementById('aum-bar-trustee').style.flex = trusteePct;
  } else {
    aumBar.style.display = 'none';
  }

  // 资产/负债比例条
  const bar = document.getElementById('ratio-bar');
  const totalSpan = d.total_assets_hkd + d.total_debt_hkd;
  const segs = [];
  for (const c of d.categories) {
    if (c.id === 'debt' || c.meta_only) continue;
    if (c.total_hkd > 0) {
      const w = c.total_hkd / totalSpan * 100;
      segs.push(`<div style="background:${c.color};flex:${w}" title="${c.name} ${fmtHkd(c.total_hkd)} (≈ ${fmtRmb(c.total_rmb)})">${w>8?c.name:''}</div>`);
    }
  }
  const debt = d.categories.find(c => c.id === 'debt');
  if (debt && debt.total_hkd > 0) {
    segs.push(`<div style="width:1px;background:#000"></div>`);
    const w = debt.total_hkd / totalSpan * 100;
    segs.push(`<div style="background:${debt.color};flex:${w}" title="负债 ${fmtHkd(debt.total_hkd)} (≈ ${fmtRmb(debt.total_rmb)})">${w>8?'负债':''}</div>`);
  }
  bar.innerHTML = segs.join('');

  // 饼图: 仅资产端 (排除负债 + 代管)
  const assetCats = d.categories.filter(c => c.id !== 'debt' && !c.meta_only);
  if (pieChart) pieChart.destroy();
  const ctx = document.getElementById('pie').getContext('2d');
  pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: assetCats.map(c => c.name),
      datasets: [{
        data: assetCats.map(c => c.total_hkd),
        backgroundColor: assetCats.map(c => c.color),
        borderColor: '#151b26',
        borderWidth: 2,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '55%',
      plugins: {
        legend: {
          position: 'right',
          labels: { color: '#e4e7eb', font: { size: 11 },
            generateLabels: () => assetCats.map((c,i) => ({
              text: `${c.name}  ${(c.total_hkd/d.total_assets_hkd*100).toFixed(1)}%`,
              fillStyle: c.color, strokeStyle: '#151b26', lineWidth: 1,
              fontColor: '#e4e7eb', index: i,
            })),
          },
        },
        tooltip: {
          callbacks: { label: (ctx) => {
            const c = assetCats[ctx.dataIndex];
            const isHidden = document.body.classList.contains('hidden-amounts');
            const mv = isHidden ? '***' : fmtHkd(c.total_hkd);
            return `${c.name}: ${mv} (${(c.total_hkd/d.total_assets_hkd*100).toFixed(1)}% 总资产)`;
          }},
        },
      },
    },
  });

  // 大类汇总表 (主货币 HKD, hover 显 RMB / USD)
  const summary = document.querySelector('#cat-summary tbody');
  summary.innerHTML = '';
  for (const c of d.categories) {
    const isDebt = c.id === 'debt';
    const isTrustee = c.meta_only === true;
    const denom = isDebt ? d.total_debt_hkd : d.total_assets_hkd;
    const tr = document.createElement('tr');
    let pctCell;
    if (isTrustee) {
      pctCell = '<span style="color:var(--muted);font-size:10px">(代管, 不计自己)</span>';
    } else if (isDebt) {
      pctCell = (denom > 0 ? pct(c.total_hkd/denom*100) : '—') + ' <span style="color:var(--muted);font-size:10px">(占总负债)</span>';
    } else {
      pctCell = denom > 0 ? pct(c.total_hkd/denom*100) : '—';
    }
    const colorCls = isTrustee ? '' : (isDebt ? 'negative' : '');
    const rowStyle = isTrustee ? 'opacity:0.7' : '';
    tr.style.cssText = rowStyle;
    tr.innerHTML = `
      <td><span class="cat-tag" style="background:${c.color}"></span>${c.name}</td>
      <td class="sensitive ${colorCls}" title="≈ ${fmtRmb(c.total_rmb)}\n≈ ${fmtUsd(c.total_usd)}">${fmtHkd(c.total_hkd)}</td>
      <td>${pctCell}</td>`;
    summary.appendChild(tr);
  }

  // 各账户明细 - 5+1 个分组卡片
  const detailsEl = document.getElementById('cat-details');
  detailsEl.innerHTML = '';
  for (const c of d.categories) {
    const isDebt = c.id === 'debt';
    const isTrustee = c.meta_only === true;
    const denom = isDebt ? d.total_debt_hkd : d.total_assets_hkd;
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.style.borderLeft = `3px solid ${c.color}`;
    card.style.background = 'rgba(255,255,255,.02)';
    card.style.borderRadius = '6px';
    card.style.padding = '12px 14px';
    card.style.marginBottom = '12px';

    const itemRows = c.items.map(item => {
      const ccyLabel = item.native_ccy === 'HKD' ? '' : `<span class="ccy-tag">${item.native_ccy}</span>`;
      const itemPct = c.total_hkd > 0 ? (item.hkd / c.total_hkd * 100) : 0;
      // 如果本币不是 HKD, 在 HKD 主数字后追加本币原值
      const nativeText = item.native_ccy === 'HKD'
        ? '' /* 同币种 */
        : `<span style="color:var(--muted);font-size:10px;margin-left:8px">本币 ${fmtNative(item.native, item.native_ccy)}</span>`;
      return `<tr>
        <td>${item.name}${ccyLabel}</td>
        <td class="sensitive" title="≈ ${fmtRmb(item.rmb)}\n≈ ${fmtUsd(item.usd)}">${fmtHkd(item.hkd)}${nativeText}</td>
        <td>${pct(itemPct)} <span class="pct-bar"><span class="fill" style="background:${c.color};width:${Math.min(100,itemPct)}%"></span></span></td>
      </tr>`;
    }).join('');

    const totalShare = denom > 0 ? (c.total_hkd/denom*100) : 0;
    let pctSuffix;
    if (isTrustee) pctSuffix = ' <span style="color:var(--muted);font-size:10px">代管, 不计个人</span>';
    else pctSuffix = ' ' + pct(totalShare) + (isDebt ? ' 占总负债' : ' 占总资产');
    if (isTrustee) card.style.opacity = '0.85';
    card.innerHTML = `
      <div class="cat-header">
        <div class="cat-name"><span class="cat-tag" style="background:${c.color}"></span>${c.name}
          <span style="color:var(--muted);font-weight:400;font-size:11px;margin-left:6px">${c.items.length} 项</span></div>
        <div class="cat-total sensitive ${isDebt?'negative':''}" title="≈ ${fmtRmb(c.total_rmb)}\n≈ ${fmtUsd(c.total_usd)}">${fmtHkd(c.total_hkd)}
          <span class="cat-pct">${pctSuffix}</span></div>
      </div>
      <table>
        <thead><tr><th>账户</th><th>HKD</th><th>组内占比</th></tr></thead>
        <tbody>${itemRows}</tbody>
      </table>`;
    detailsEl.appendChild(card);
  }
}

// 顶部通知 banner —— 2026-10-29 春永：不再显示任何飞书表改动记录（daily_balance_job 10-26 起已不写 notifications.json），
// 保留函数名避免调用处报错；区域固定清空。
async function loadNotifications() {
  const area = document.getElementById('notif-area');
  if (area) area.innerHTML = '';
}
async function dismissNotif(id) {
  await fetch('/api/notifications/dismiss?id=' + id, {cache:'no-store'});
  loadNotifications();
}

// === 月度净资产趋势 ===
let trendChart = null;
async function loadTrend() {
  try {
    const r = await fetch('/api/balance_history', {cache:'no-store'});
    const h = await r.json();
    if (h.error) return;
    // 收集所有月份并排序
    const allMonths = Array.from(new Set([
      ...h.mine.map(p=>p.month),
      ...h.xi.map(p=>p.month),
      ...h.family.map(p=>p.month),
    ])).sort();
    // 主显 HKD, tooltip 同时显示 RMB
    function alignTo(months, pts, field) {
      const m = Object.fromEntries(pts.map(p=>[p.month, p[field]]));
      return months.map(mon => m.hasOwnProperty(mon) ? m[mon] : null);
    }
    const dataMine = alignTo(allMonths, h.mine, 'net_hkd_k');
    const dataXi = alignTo(allMonths, h.xi, 'net_hkd_k');
    const dataFam = alignTo(allMonths, h.family, 'net_hkd_k');
    const rmbMine = alignTo(allMonths, h.mine, 'net_rmb_k');
    const rmbXi = alignTo(allMonths, h.xi, 'net_rmb_k');
    const rmbFam = alignTo(allMonths, h.family, 'net_rmb_k');
    const rmbByKey = { '我的': rmbMine, '家人': rmbXi, '家庭': rmbFam };

    // 当前 tab 决定哪条线高亮
    const activeKey = SRC.api.includes('xi') ? 'xi' : (SRC.api.includes('family') ? 'family' : 'mine');
    function styleFor(key, color) {
      const isActive = (key === activeKey);
      return {
        borderWidth: isActive ? 3 : 1.5,
        pointRadius: isActive ? 4 : 2,
        pointHoverRadius: 6,
        borderColor: color,
        backgroundColor: color + '22',
        tension: 0.25,
        fill: false,
        spanGaps: true,
      };
    }

    if (trendChart) trendChart.destroy();
    const ctx = document.getElementById('trend-chart').getContext('2d');
    const isPrivate = () => document.body.classList.contains('hidden-amounts');
    trendChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: allMonths,
        datasets: [
          { label:'我的', data:dataMine, ...styleFor('mine', '#60a5fa') },
          { label:'家人', data:dataXi, ...styleFor('xi', '#f472b6') },
          { label:'家庭', data:dataFam, ...styleFor('family', '#10b981') },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode:'index', intersect:false },
        plugins: {
          legend: { labels: { color:'#e4e7eb', font:{size:12} } },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const v = ctx.parsed.y;
                if (v === null) return ctx.dataset.label + ': —';
                if (isPrivate()) return ctx.dataset.label + ': HK$●●●K';
                const rmbSeries = rmbByKey[ctx.dataset.label] || [];
                const rmb = rmbSeries[ctx.dataIndex];
                const rmbStr = (rmb != null) ? '  (≈¥' + rmb.toLocaleString() + 'K)' : '';
                return ctx.dataset.label + ': HK$' + v.toLocaleString() + 'K' + rmbStr;
              }
            }
          },
        },
        scales: {
          x: { ticks:{color:'#8893a6', font:{size:10}}, grid:{color:'rgba(255,255,255,.04)'} },
          y: {
            ticks: {
              color:'#8893a6', font:{size:10},
              callback: (v) => isPrivate() ? 'HK$●●●' : 'HK$'+v.toLocaleString()+'K',
            },
            grid: { color:'rgba(255,255,255,.04)' },
          },
        },
      },
    });
    // 注释最后一行: 当月数据来源
    const liveMonths = [...h.mine,...h.xi].filter(p=>p.live).map(p=>p.month);
    if (liveMonths.length) {
      document.getElementById('trend-note').textContent =
        `${liveMonths[0]} 为当月实时数据 · 历史月份只取真正记账的月份 (2026-03 之前手填, 2026-07 = 7 月底记账)`;
    }
  } catch (e) {
    console.error('trend load failed', e);
  }
}

load();
loadNotifications();
loadTrend();
setInterval(load, 60000);
setInterval(loadNotifications, 120000);
setInterval(loadTrend, 600000);  // 10分钟一次趋势图
</script>
